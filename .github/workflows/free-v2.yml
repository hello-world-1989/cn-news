name: free-v2

# Republishes the free xrayr-next subscription in the same form as
# end-gfw-together / clash.yaml:
#   end-gfw-free       v2rayN / v2rayNG / Hiddify / Karing / Shadowrocket (base64)
#   clash-free.yaml    Clash Verge / mihomo
# Node IPs change when a node is rotated, so this runs every 10 minutes and only
# commits when the content changed.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-v2
  cancel-in-progress: false

env:
  # Shared public free account. Its id is the UUID inside every published link,
  # so it is not a secret; it cannot be used to buy or upgrade a plan.
  FREE_TOKEN: 2db985f6-21bf-40c2-a4f1-4ce2cf90b1c2
  # Subscription domains, tried in order
  BASES: https://sub2.anti-involution.net https://sub2.food-safety.academy

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            end-gfw-free
            clash-free.yaml
          sparse-checkout-cone-mode: false
      - name: Fetch
        run: |
          set -eu
          ok=
          for base in $BASES; do
            if curl -fsS -m 30 --retry 2 "$base/sub?token=$FREE_TOKEN" -o /tmp/sub \
              && curl -fsS -m 60 --retry 2 "$base/clash?token=$FREE_TOKEN" -o /tmp/clash; then
              ok=1; break
            fi
            echo "failed: $base"
          done
          [ -n "$ok" ] || { echo "all subscription domains failed"; exit 1; }
          # Never replace good files with an empty or broken download
          base64 -d /tmp/sub | grep -qE '^(vless|hysteria2|ss)://' || { echo "no nodes in subscription"; exit 1; }
          grep -q '^proxies:' /tmp/clash || { echo "clash profile looks wrong"; exit 1; }
          cp /tmp/sub end-gfw-free
          cp /tmp/clash clash-free.yaml
      - name: Commit
        run: |
          set -eu
          git add end-gfw-free clash-free.yaml
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git -c user.name=Git -c user.email=git@example.com commit -m "free nodes $(date -u '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
